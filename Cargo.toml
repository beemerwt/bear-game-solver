[package]
name = "bear-game-solver"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["macros","rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features=["fs"] }
